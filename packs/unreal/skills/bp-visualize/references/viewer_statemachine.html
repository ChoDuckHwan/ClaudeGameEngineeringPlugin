<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{ASSET_NAME}} — State Machine Guide</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
:root { --bg:#1e1e1e; --fg:#e0e0e0; --panel:#2d2d2d; --panel2:#252525;
  --border:#3e3e3e; --accent:#4a9eff; --muted:#888; --hl:#ff5722; --done:#4caf50;
  --entry:#7ed957; --state:#4a9eff; --trans:#ffa726; }
body.light { --bg:#fafafa; --fg:#222; --panel:#fff; --panel2:#f3f3f3;
  --border:#ddd; --accent:#0066cc; --muted:#777; --hl:#d84315; --done:#388e3c; }
* { box-sizing:border-box; }
html, body { margin:0; padding:0; height:100%; }
body { font-family:'Segoe UI',-apple-system,sans-serif; background:var(--bg); color:var(--fg);
  display:flex; flex-direction:column; overflow:hidden; }
header { padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex-shrink:0; }
header h1 { margin:0; font-size:15px; font-weight:500; }
header .sub { color:var(--muted); font-size:12px; margin-left:6px; }
.btn { padding:4px 10px; background:var(--accent); color:#fff; border:none;
  border-radius:4px; cursor:pointer; font-size:12px; }
.btn.sec { background:var(--panel2); color:var(--fg); border:1px solid var(--border); }
.legend { display:flex; gap:3px; font-size:10px; flex-wrap:wrap; }
.legend span { padding:2px 6px; border-radius:3px; font-weight:500; }
main { flex:1; display:flex; overflow:hidden; min-height:0; }
#cy { flex:1; background:var(--bg); min-width:0; }
aside { width:380px; display:flex; flex-direction:column;
  background:var(--panel); border-left:1px solid var(--border); }
.panel { padding:10px 14px; overflow-y:auto; }
.panel h2 { margin:0 0 8px 0; font-size:13px; color:var(--accent);
  border-bottom:1px solid var(--border); padding-bottom:4px; font-weight:600;
  display:flex; justify-content:space-between; }
#steps-panel { flex:1; border-bottom:1px solid var(--border); min-height:200px; }
#details-panel { flex:0 0 38%; background:var(--panel2); }
.step { padding:8px 10px; margin:4px 0; background:var(--panel2);
  border-left:3px solid transparent; border-radius:4px; cursor:pointer;
  display:flex; gap:8px; align-items:flex-start; font-size:12px; line-height:1.45; }
.step:hover { background:var(--bg); border-left-color:var(--accent); }
.step.active { background:rgba(74,158,255,0.15); border-left-color:var(--accent); }
.step.done .num { background:var(--done); }
.step.done .text { text-decoration:line-through; opacity:0.6; }
.step .num { flex:0 0 22px; height:22px; background:var(--accent); color:#fff;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:bold; }
.step .text { flex:1; }
.step .check { flex:0 0 16px; cursor:pointer; margin-top:3px; }
.row { display:flex; padding:3px 0; border-bottom:1px dotted var(--border); font-size:12px; }
.key { flex:0 0 95px; color:var(--muted); font-size:11px; }
.val { flex:1; word-break:break-all; font-family:'Consolas',monospace; font-size:11px; }
.empty { color:var(--muted); font-style:italic; padding:12px 0; text-align:center; font-size:12px; }
.section { margin-top:10px; }
footer { padding:3px 14px; font-size:10px; color:var(--muted);
  background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
</style>
</head>
<body>
<header>
  <h1 id="title">State Machine<span class="sub" id="subtitle"></span></h1>
  <input class="search" id="search" placeholder="🔍 상태 검색..." style="padding:4px 8px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:4px;min-width:160px;font-size:12px">
  <button class="btn" onclick="cy.fit(null, 40)">Fit</button>
  <button class="btn sec" onclick="document.body.classList.toggle('light')">🌓</button>
  <button class="btn sec" onclick="resetSteps()">진행도 리셋</button>
  <div class="legend">
    <span style="background:#7ed957;color:#000">▶ Entry</span>
    <span style="background:#4a9eff;color:#fff">State</span>
    <span style="background:#ffa726;color:#000">Transition</span>
  </div>
</header>
<main>
  <div id="cy"></div>
  <aside>
    <div class="panel" id="steps-panel">
      <h2><span>📋 작업 단계</span> <span id="progress" style="font-size:11px;font-weight:normal;color:var(--muted)">0 / 0</span></h2>
      <div id="steps-list"></div>
    </div>
    <div class="panel" id="details-panel">
      <h2>🔍 상세</h2>
      <div id="details">
        <div class="empty">상태/전환 클릭<br>또는 왼쪽 단계 클릭</div>
      </div>
    </div>
  </aside>
</main>
<footer id="footer">bp-visualize • AnimBP State Machine Authoring Guide</footer>

<script>
const DSL = /*<<DATA>>*/ {
  "target":"AnimInstance", "name":"ABP_Demo", "graph":"StateMachine",
  "machine_name":"Loco_SM", "goal":"Idle/Walk/Run",
  "states":[
    { "id":"Idle", "asset":"Anim_Idle", "is_entry":true },
    { "id":"Walk", "asset":"BS_Walk" },
    { "id":"Run", "asset":"BS_Run" }
  ],
  "transitions":[
    { "id":"t1", "from":"Idle", "to":"Walk", "condition":"Speed > 10" },
    { "id":"t2", "from":"Walk", "to":"Run", "condition":"Speed > 300" }
  ],
  "steps":[
    { "id":"s1", "text":"AnimGraph에서 New State Machine", "highlight":[] },
    { "id":"s2", "text":"Idle 상태 추가 (entry)", "highlight":["Idle"] },
    { "id":"s3", "text":"Walk 상태 추가", "highlight":["Walk"] },
    { "id":"s4", "text":"Idle → Walk 전환", "highlight":["Idle","Walk","t1"] }
  ]
};

const elements = [];

// Entry node (virtual)
const hasEntry = (DSL.states || []).some(s => s.is_entry);
if (hasEntry) {
  elements.push({ data:{ id:'__entry__', label:'▶ Entry', kind:'entry', full:{ id:'__entry__', kind:'entry' }}});
}

(DSL.states || []).forEach(s => {
  elements.push({ data:{ id:s.id, label:`${s.display_name || s.id}\n[${s.asset || ''}]`, kind:'state', full:s }});
  if (s.is_entry) {
    elements.push({ data:{ id:'__entry__->'+s.id, source:'__entry__', target:s.id, label:'', kind:'entry-edge' }});
  }
});

(DSL.transitions || []).forEach(t => {
  elements.push({
    data:{ id:t.id, source:t.from, target:t.to, label:t.condition || '', kind:'transition', full:t }
  });
});

document.getElementById('title').firstChild.textContent = (DSL.name || 'StateMachine') + " ";
document.getElementById('subtitle').textContent = "— " + (DSL.goal || '') + (DSL.machine_name ? " · " + DSL.machine_name : "");
document.title = (DSL.name || 'SM') + " — State Machine Guide";
document.getElementById('footer').textContent =
  `bp-visualize • ${DSL.name} • 상태 ${(DSL.states||[]).length} · 전환 ${(DSL.transitions||[]).length}`;

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements, wheelSensitivity: 0.2,
  style: [
    { selector:'node', style:{
      'label':'data(label)','text-wrap':'wrap','text-valign':'center','text-halign':'center',
      'color':'#fff','font-size':11,'font-family':'Consolas,monospace',
      'shape':'ellipse','width':80,'height':80,
      'background-color':'#4a9eff','border-width':2,'border-color':'#222',
      'text-outline-color':'#000','text-outline-width':0.5,'padding':'8px'
    }},
    { selector:'node[kind="entry"]', style:{
      'shape':'round-rectangle','background-color':'#7ed957','color':'#000',
      'text-outline-color':'#fff','width':60,'height':32,'font-weight':'bold'
    }},
    { selector:'node[kind="state"]', style:{ 'width':'label','height':'label','padding':'16px' }},
    { selector:'edge', style:{
      'width':2,'line-color':'#ffa726','target-arrow-shape':'triangle','target-arrow-color':'#ffa726',
      'curve-style':'bezier','label':'data(label)','font-size':9,'color':'#fff',
      'text-background-color':'#1e1e1e','text-background-opacity':0.85,
      'text-background-padding':'2px','text-background-shape':'round-rectangle',
      'edge-text-rotation':'autorotate'
    }},
    { selector:'edge[kind="entry-edge"]', style:{ 'line-color':'#7ed957','target-arrow-color':'#7ed957','width':2 }},
    { selector:'edge[kind="transition"]:selected', style:{ 'line-color':'#ff5722','target-arrow-color':'#ff5722','width':3.5 }},
    { selector:'node:selected', style:{ 'border-color':'#fff','border-width':4 }},
    { selector:'.highlight', style:{ 'border-color':'#ff5722','border-width':5 }},
    { selector:'edge.highlight', style:{ 'line-color':'#ff5722','target-arrow-color':'#ff5722','width':3.5 }},
    { selector:'.dim', style:{ 'opacity':0.2 }},
  ],
  layout: { name:'cose', idealEdgeLength:120, nodeOverlap:20, animate:false, padding:50, fit:true }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const stepStates = (DSL.steps || []).map(() => false);

function renderSteps() {
  const list = document.getElementById('steps-list');
  list.innerHTML = (DSL.steps || []).map((s, i) => `
    <div class="step ${stepStates[i]?'done':''}" data-idx="${i}">
      <input type="checkbox" class="check" ${stepStates[i]?'checked':''} onclick="event.stopPropagation();toggleStep(${i})">
      <div class="num">${i+1}</div>
      <div class="text">${escapeHtml(s.text)}</div>
    </div>
  `).join('');
  list.querySelectorAll('.step').forEach(el => {
    el.addEventListener('click', () => activateStep(parseInt(el.dataset.idx)));
  });
  updateProgress();
}
function updateProgress() {
  const done = stepStates.filter(Boolean).length;
  document.getElementById('progress').textContent = `${done} / ${stepStates.length}`;
}
function toggleStep(idx) { stepStates[idx] = !stepStates[idx]; renderSteps(); }
function resetSteps() { for (let i=0;i<stepStates.length;i++) stepStates[i] = false; renderSteps(); }

let activeStepIdx = -1;
function activateStep(idx) {
  activeStepIdx = idx;
  document.querySelectorAll('.step').forEach((el, i) => el.classList.toggle('active', i === idx));
  const step = DSL.steps[idx];
  cy.elements().removeClass('highlight').removeClass('dim');
  const hl = step.highlight || [];
  if (hl.length === 0) { showStepDetails(step); return; }
  const matched = cy.elements().filter(n => hl.includes(n.data('id')));
  cy.elements().not(matched).addClass('dim');
  matched.addClass('highlight');
  if (matched.length > 0) cy.animate({ fit:{ eles:matched, padding:80 }, duration:350 });
  const fullData = matched.map(m => m.data('full')).filter(Boolean);
  showStepDetails(step, fullData);
}

function showStepDetails(step, items) {
  const info = (items && items.length) ? `
    <div class="section">
      <h2 style="border:none;margin-bottom:4px">강조 (${items.length})</h2>
      ${items.map(it => entityRows(it)).join('<hr style="border:none;border-top:1px dashed var(--border);margin:6px 0">')}
    </div>` : '';
  document.getElementById('details').innerHTML = `
    <div class="row"><div class="key">step</div><div class="val">${step.id || '#'+(activeStepIdx+1)}</div></div>
    <div class="row"><div class="key">action</div><div class="val">${escapeHtml(step.text)}</div></div>
    ${info}
  `;
}

function entityRows(d) {
  if (!d) return '';
  if (d.from && d.to) {
    return `
      <div class="row"><div class="key">type</div><div class="val">Transition</div></div>
      <div class="row"><div class="key">id</div><div class="val"><strong>${escapeHtml(d.id)}</strong></div></div>
      <div class="row"><div class="key">from</div><div class="val">${escapeHtml(d.from)}</div></div>
      <div class="row"><div class="key">to</div><div class="val">${escapeHtml(d.to)}</div></div>
      <div class="row"><div class="key">condition</div><div class="val">${escapeHtml(d.condition || '')}</div></div>
      ${d.duration ? `<div class="row"><div class="key">duration</div><div class="val">${d.duration}s</div></div>` : ''}
    `;
  }
  return `
    <div class="row"><div class="key">type</div><div class="val">${d.is_entry ? 'Entry State' : 'State'}</div></div>
    <div class="row"><div class="key">id</div><div class="val"><strong>${escapeHtml(d.id)}</strong></div></div>
    <div class="row"><div class="key">asset</div><div class="val">${escapeHtml(d.asset || '(none)')}</div></div>
    ${d.display_name ? `<div class="row"><div class="key">name</div><div class="val">${escapeHtml(d.display_name)}</div></div>` : ''}
  `;
}

cy.on('tap', 'node,edge', e => {
  const d = e.target.data('full');
  if (!d) return;
  const refSteps = (DSL.steps || []).map((s, i) => (s.highlight || []).includes(d.id) ? i+1 : null).filter(x => x);
  document.getElementById('details').innerHTML = `
    ${entityRows(d)}
    ${refSteps.length ? `<div class="section"><h2 style="border:none;margin-bottom:4px">관련 단계</h2>
      <div style="font-size:11px;color:var(--muted)">단계: ${refSteps.join(', ')}</div></div>` : ''}
  `;
});
cy.on('tap', e => { if (e.target === cy) { cy.elements().removeClass('dim').removeClass('highlight');
  document.querySelectorAll('.step').forEach(el => el.classList.remove('active')); activeStepIdx = -1; }});

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  cy.elements().removeClass('highlight').removeClass('dim');
  if (!q) return;
  const matched = cy.elements().filter(n => {
    const f = n.data('full');
    return n.data('id').toLowerCase().includes(q) ||
      (f && f.asset && f.asset.toLowerCase().includes(q)) ||
      (f && f.condition && f.condition.toLowerCase().includes(q));
  });
  cy.elements().not(matched).addClass('dim');
  matched.addClass('highlight');
});

renderSteps();
</script>
</body>
</html>
