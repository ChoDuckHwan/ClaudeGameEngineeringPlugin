<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{ASSET_NAME}} — BehaviorTree Guide</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
:root { --bg:#1e1e1e; --fg:#e0e0e0; --panel:#2d2d2d; --panel2:#252525;
  --border:#3e3e3e; --accent:#4a9eff; --muted:#888; --hl:#ff5722; --done:#4caf50; }
body.light { --bg:#fafafa; --fg:#222; --panel:#fff; --panel2:#f3f3f3;
  --border:#ddd; --accent:#0066cc; --muted:#777; --hl:#d84315; --done:#388e3c; }
* { box-sizing:border-box; }
html, body { margin:0; padding:0; height:100%; }
body { font-family:'Segoe UI',-apple-system,sans-serif; background:var(--bg); color:var(--fg);
  display:flex; flex-direction:column; overflow:hidden; }
header { padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex-shrink:0; }
header h1 { margin:0; font-size:15px; font-weight:500; }
header .sub { color:var(--muted); font-size:12px; margin-left:6px; }
.btn { padding:4px 10px; background:var(--accent); color:#fff; border:none;
  border-radius:4px; cursor:pointer; font-size:12px; }
.btn.sec { background:var(--panel2); color:var(--fg); border:1px solid var(--border); }
.search { padding:4px 8px; background:var(--bg); color:var(--fg);
  border:1px solid var(--border); border-radius:4px; min-width:160px; font-size:12px; }
.legend { display:flex; gap:3px; font-size:10px; flex-wrap:wrap; }
.legend span { padding:2px 6px; border-radius:3px; font-weight:500; }
main { flex:1; display:flex; overflow:hidden; min-height:0; }
#cy { flex:1; background:var(--bg); min-width:0; }
aside { width:380px; display:flex; flex-direction:column;
  background:var(--panel); border-left:1px solid var(--border); }
.panel { padding:10px 14px; overflow-y:auto; }
.panel h2 { margin:0 0 8px 0; font-size:13px; color:var(--accent);
  border-bottom:1px solid var(--border); padding-bottom:4px; font-weight:600;
  display:flex; justify-content:space-between; }
#steps-panel { flex:1; border-bottom:1px solid var(--border); min-height:200px; }
#details-panel { flex:0 0 38%; background:var(--panel2); }
.step { padding:8px 10px; margin:4px 0; background:var(--panel2);
  border-left:3px solid transparent; border-radius:4px; cursor:pointer;
  display:flex; gap:8px; align-items:flex-start; font-size:12px; line-height:1.45; }
.step:hover { background:var(--bg); border-left-color:var(--accent); }
.step.active { background:rgba(74,158,255,0.15); border-left-color:var(--accent); }
.step.done .num { background:var(--done); }
.step.done .text { text-decoration:line-through; opacity:0.6; }
.step .num { flex:0 0 22px; height:22px; background:var(--accent); color:#fff;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:bold; }
.step .text { flex:1; }
.step .check { flex:0 0 16px; cursor:pointer; margin-top:3px; }
.row { display:flex; padding:3px 0; border-bottom:1px dotted var(--border); font-size:12px; }
.key { flex:0 0 95px; color:var(--muted); font-size:11px; }
.val { flex:1; word-break:break-all; font-family:'Consolas',monospace; font-size:11px; }
.chip { display:inline-block; padding:2px 6px; margin:2px 4px 2px 0;
  background:var(--border); border-radius:3px; font-size:10px; }
.empty { color:var(--muted); font-style:italic; padding:12px 0; text-align:center; font-size:12px; }
.section { margin-top:10px; }
.bb-card { background:var(--bg); padding:8px; border-radius:4px; margin-top:6px; font-size:11px; }
.bb-card .k { color:var(--accent); font-weight:bold; }
footer { padding:3px 14px; font-size:10px; color:var(--muted);
  background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
</style>
</head>
<body>
<header>
  <h1 id="title">BehaviorTree<span class="sub" id="subtitle"></span></h1>
  <input class="search" id="search" placeholder="🔍 노드 검색...">
  <button class="btn" onclick="cy.fit(null, 40)">Fit</button>
  <button class="btn sec" onclick="document.body.classList.toggle('light')">🌓</button>
  <button class="btn sec" onclick="resetSteps()">진행도 리셋</button>
  <div class="legend">
    <span style="background:#4a9eff;color:#fff">Composite</span>
    <span style="background:#7ed957;color:#000">Task</span>
    <span style="background:#ffa726;color:#000">Decorator</span>
    <span style="background:#9c27b0;color:#fff">Service</span>
  </div>
</header>
<main>
  <div id="cy"></div>
  <aside>
    <div class="panel" id="steps-panel">
      <h2><span>📋 작업 단계</span> <span id="progress" style="font-size:11px;font-weight:normal;color:var(--muted)">0 / 0</span></h2>
      <div id="steps-list"></div>
    </div>
    <div class="panel" id="details-panel">
      <h2>🔍 노드 상세</h2>
      <div id="details">
        <div class="empty">노드를 클릭하거나<br>왼쪽 단계를 클릭하세요</div>
      </div>
    </div>
  </aside>
</main>
<footer id="footer">bp-visualize • BehaviorTree Authoring Guide</footer>

<script>
// === DSL 데이터 ===
const DSL = /*<<DATA>>*/ {
  "target":"BehaviorTree", "name":"BT_Demo", "goal":"데모 BT",
  "blackboard": { "name":"BB_Demo", "keys":[{"name":"HasTarget","type":"Bool"}] },
  "tree": {
    "type":"Composite", "class":"BTComposite_Selector", "id":"Root", "display_name":"Root Selector",
    "decorators":[], "services":[],
    "children":[
      { "type":"Composite", "class":"BTComposite_Sequence", "id":"Seq1", "display_name":"Chase",
        "decorators":[{"class":"BTDecorator_Blackboard","id":"Deco1","key":"HasTarget","op":"IsSet"}],
        "services":[],
        "children":[
          { "type":"Task", "class":"BTTask_MoveTo", "id":"Move1", "display_name":"MoveTo" }
        ]
      }
    ]
  },
  "steps":[
    { "id":"s1", "text":"BT 신규 생성", "highlight":[] },
    { "id":"s2", "text":"Root Selector 추가", "highlight":["Root"] },
    { "id":"s3", "text":"Chase Sequence + Decorator", "highlight":["Seq1","Deco1"] },
    { "id":"s4", "text":"MoveTo Task", "highlight":["Move1"] }
  ]
};

const elements = [];
function addNode(node, parentId) {
  if (!node) return;
  const display = node.display_name || node.class;
  const label = `${display}\n[${node.type}]\n${node.id}`;
  elements.push({ data:{ id:node.id, label, type:node.type, full:node }});
  if (parentId) elements.push({ data:{ id:parentId+'->'+node.id, source:parentId, target:node.id }});

  (node.decorators || []).forEach(d => {
    elements.push({ data:{ id:d.id, label:`${d.class}\n[Deco]\n${d.key||''}`, type:'Decorator', full:d }});
    elements.push({ data:{ id:d.id+'->'+node.id, source:d.id, target:node.id, attach:'deco' }});
  });
  (node.services || []).forEach(s => {
    elements.push({ data:{ id:s.id, label:`${s.class}\n[Svc]`, type:'Service', full:s }});
    elements.push({ data:{ id:s.id+'->'+node.id, source:s.id, target:node.id, attach:'svc' }});
  });
  (node.children || []).forEach(c => addNode(c, node.id));
}
addNode(DSL.tree, null);

document.getElementById('title').firstChild.textContent = (DSL.name || 'BT') + " ";
document.getElementById('subtitle').textContent = "— " + (DSL.goal || 'BehaviorTree');
document.title = (DSL.name || 'BT') + " — BehaviorTree Guide";
document.getElementById('footer').textContent = `bp-visualize • ${DSL.name} • 단계 ${(DSL.steps||[]).length}` +
  (DSL.blackboard ? ` • BB: ${DSL.blackboard.name}` : '');

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements, wheelSensitivity: 0.2,
  style: [
    { selector:'node', style:{
      'label':'data(label)','text-wrap':'wrap','text-valign':'center','text-halign':'center',
      'color':'#fff','font-size':10,'font-family':'Consolas,monospace',
      'shape':'round-rectangle','width':'label','height':'label','padding':'10px',
      'background-color':'#888','border-width':1,'border-color':'#222',
      'text-outline-color':'#000','text-outline-width':0.5
    }},
    { selector:'node[type="Composite"]', style:{'background-color':'#4a9eff'}},
    { selector:'node[type="Task"]', style:{'background-color':'#7ed957','color':'#000','text-outline-color':'#fff'}},
    { selector:'node[type="Decorator"]', style:{'background-color':'#ffa726','color':'#000','text-outline-color':'#fff','shape':'diamond'}},
    { selector:'node[type="Service"]', style:{'background-color':'#9c27b0','shape':'ellipse'}},
    { selector:'edge', style:{'width':1.5,'line-color':'#666','curve-style':'taxi','taxi-direction':'downward','taxi-turn':20}},
    { selector:'edge[attach="deco"]', style:{'line-style':'dashed','line-color':'#ffa726','width':1}},
    { selector:'edge[attach="svc"]', style:{'line-style':'dashed','line-color':'#9c27b0','width':1}},
    { selector:'node:selected', style:{'border-color':'#fff','border-width':3}},
    { selector:'.highlight', style:{'border-color':'#ff5722','border-width':5}},
    { selector:'.dim', style:{'opacity':0.25}},
  ],
  layout: { name:'dagre', rankDir:'TB', spacingFactor:1.1, nodeSep:30, rankSep:60, fit:true, padding:25 }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const stepStates = (DSL.steps || []).map(() => false);

function renderSteps() {
  const list = document.getElementById('steps-list');
  list.innerHTML = (DSL.steps || []).map((s, i) => `
    <div class="step ${stepStates[i]?'done':''}" data-idx="${i}">
      <input type="checkbox" class="check" ${stepStates[i]?'checked':''} onclick="event.stopPropagation();toggleStep(${i})">
      <div class="num">${i+1}</div>
      <div class="text">${escapeHtml(s.text)}</div>
    </div>
  `).join('');
  list.querySelectorAll('.step').forEach(el => {
    el.addEventListener('click', () => activateStep(parseInt(el.dataset.idx)));
  });
  updateProgress();
}

function updateProgress() {
  const done = stepStates.filter(Boolean).length;
  document.getElementById('progress').textContent = `${done} / ${stepStates.length}`;
}

function toggleStep(idx) { stepStates[idx] = !stepStates[idx]; renderSteps(); }
function resetSteps() { for (let i=0;i<stepStates.length;i++) stepStates[i] = false; renderSteps(); }

let activeStepIdx = -1;
function activateStep(idx) {
  activeStepIdx = idx;
  document.querySelectorAll('.step').forEach((el, i) => el.classList.toggle('active', i === idx));
  const step = DSL.steps[idx];
  cy.elements().removeClass('highlight').removeClass('dim');
  const hl = step.highlight || [];
  if (hl.length === 0) { showStepDetails(step); return; }
  const matched = cy.nodes().filter(n => hl.includes(n.data('id')));
  cy.nodes().not(matched).addClass('dim');
  matched.addClass('highlight');
  if (matched.length > 0) cy.animate({ fit:{ eles:matched, padding:80 }, duration:350 });
  showStepDetails(step, matched.map(n => n.data('full')));
}

function showStepDetails(step, nodes) {
  const bb = DSL.blackboard ? `
    <div class="section"><h2 style="border:none;margin-bottom:4px">Blackboard</h2>
      <div class="bb-card">
        <div><span class="k">name:</span> ${escapeHtml(DSL.blackboard.name)}</div>
        ${(DSL.blackboard.keys || []).map(k => `<div><span class="k">${escapeHtml(k.name)}</span>: ${escapeHtml(k.type)}</div>`).join('')}
      </div>
    </div>` : '';
  const nodeInfo = (nodes && nodes.length) ? `
    <div class="section">
      <h2 style="border:none;margin-bottom:4px">강조 노드 (${nodes.length})</h2>
      ${nodes.map(n => nodeRows(n)).join('<hr style="border:none;border-top:1px dashed var(--border);margin:6px 0">')}
    </div>` : '';
  document.getElementById('details').innerHTML = `
    <div class="row"><div class="key">step</div><div class="val">${step.id || '#'+(activeStepIdx+1)}</div></div>
    <div class="row"><div class="key">action</div><div class="val">${escapeHtml(step.text)}</div></div>
    ${nodeInfo}
    ${nodes && nodes.length ? '' : bb}
  `;
}

function nodeRows(d) {
  if (!d) return '';
  const chips = (arr, label) => (!arr || !arr.length) ? '' :
    `<div class="row"><div class="key">${label}</div><div class="val">${arr.map(x => `<span class="chip">${escapeHtml(x.class)}</span>`).join('')}</div></div>`;
  return `
    <div class="row"><div class="key">id</div><div class="val"><strong>${escapeHtml(d.id)}</strong></div></div>
    <div class="row"><div class="key">type</div><div class="val">${escapeHtml(d.type)}</div></div>
    <div class="row"><div class="key">class</div><div class="val">${escapeHtml(d.class)}</div></div>
    ${d.display_name ? `<div class="row"><div class="key">name</div><div class="val">${escapeHtml(d.display_name)}</div></div>` : ''}
    ${d.key ? `<div class="row"><div class="key">bb_key</div><div class="val">${escapeHtml(d.key)}</div></div>` : ''}
    ${d.op ? `<div class="row"><div class="key">operator</div><div class="val">${escapeHtml(d.op)}</div></div>` : ''}
    ${d.blackboard_key ? `<div class="row"><div class="key">bb_key</div><div class="val">${escapeHtml(d.blackboard_key)}</div></div>` : ''}
    ${chips(d.decorators, 'decorators')}
    ${chips(d.services, 'services')}
  `;
}

cy.on('tap', 'node', e => {
  const d = e.target.data('full');
  const refSteps = (DSL.steps || []).map((s, i) => (s.highlight || []).includes(d.id) ? i+1 : null).filter(x => x);
  document.getElementById('details').innerHTML = `
    ${nodeRows(d)}
    ${refSteps.length ? `<div class="section"><h2 style="border:none;margin-bottom:4px">관련 단계</h2>
      <div style="font-size:11px;color:var(--muted)">단계: ${refSteps.join(', ')}</div></div>` : ''}
  `;
});
cy.on('tap', e => { if (e.target === cy) { cy.elements().removeClass('dim').removeClass('highlight');
  document.querySelectorAll('.step').forEach(el => el.classList.remove('active')); activeStepIdx = -1; }});

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  cy.elements().removeClass('highlight').removeClass('dim');
  if (!q) return;
  const matched = cy.nodes().filter(n => {
    const f = n.data('full');
    return n.data('id').toLowerCase().includes(q) || (f.class||'').toLowerCase().includes(q) || (f.display_name||'').toLowerCase().includes(q);
  });
  cy.nodes().not(matched).addClass('dim');
  matched.addClass('highlight');
});

renderSteps();
</script>
</body>
</html>
